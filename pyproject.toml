[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-knowledge-base"
version = "0.1.0"
description = "Transform YouTube videos into a searchable AI knowledge base using Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "AI Knowledge Base", email = "admin@example.com"},
]
keywords = ["ai", "knowledge-base", "youtube", "claude-code", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asyncpg>=0.28.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "yt-dlp>=2024.1.0",
    "sentence-transformers>=2.2.0",
    "rapidfuzz>=3.0.0",
    "torch>=2.0.0",
    "tiktoken>=0.5.0",
    "pysbd>=0.3.4",
    "pgvector>=0.4.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/ai-knowledge-base"
Repository = "https://github.com/yourusername/ai-knowledge-base"
Issues = "https://github.com/yourusername/ai-knowledge-base/issues"
Changelog = "https://github.com/yourusername/ai-knowledge-base/blob/main/CHANGELOG.md"

[project.scripts]
ai-kb = "main:main"

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "-ra",
]
asyncio_mode = "auto"
